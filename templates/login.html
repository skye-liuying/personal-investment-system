<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 投资管家</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #014DB2 0%, #013a8a 60%, #0A1628 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .login-card {
            background: #fff;
            width: 400px;
            border-radius: 16px;
            padding: 40px 36px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .login-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .login-logo .logo-icon {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-title {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            color: #0A1628;
            margin: 12px 0 4px;
        }
        .login-subtitle {
            text-align: center;
            font-size: 13px;
            color: #6B7280;
            margin: 0 0 28px;
        }
        .login-form .form-group {
            margin-bottom: 16px;
        }
        .login-form label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 6px;
        }
        .login-form input {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #D1D5DB;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .login-form input:focus {
            border-color: #014DB2;
            box-shadow: 0 0 0 3px rgba(1, 77, 178, 0.12);
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: #014DB2;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }
        .login-btn:hover {
            background: #013a8a;
        }
        .login-error {
            background: #FEE2E2;
            color: #B91C1C;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
        }
        .login-success {
            background: #D1FAE5;
            color: #047857;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
        }
        .login-hint {
            text-align: center;
            font-size: 12px;
            color: #9CA3AF;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">
            <div class="logo-icon">
                <svg width="40" height="40" viewBox="0 0 28 28" fill="none">
                    <rect width="28" height="28" rx="6" fill="#014DB2"/>
                    <path d="M8 20V14M14 20V10M20 20V16" stroke="white" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>
        </div>
        <h1 class="login-title">投资管家</h1>
        <p class="login-subtitle">请使用用户名和密码登录</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="login-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form class="login-form" method="post" action="{{ url_for('auth.login') }}">
            <div class="form-group">
                <label for="user_id">用户名</label>
                <input type="text" id="user_id" name="user_id" placeholder="请输入用户名" autocomplete="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" autocomplete="current-password" required>
            </div>
            <button type="submit" class="login-btn">登 录</button>
        </form>
        <p class="login-hint">默认超级管理员：admin / admin</p>
    </div>
</body>
</html>
